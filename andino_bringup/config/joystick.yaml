joy_linux_node:
  ros__parameters:
    dev: /dev/input/js2
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 3      # <--- Mapped linear Y (strafing) to axis 3
    scale_linear:
      x: 0.3
      y: 0.3    # <--- Added normal scale for Y
    scale_linear_turbo:
      x: 1.0
      y: 1.0

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 4.0  # <--- Established angular yaw speed at 16.34
    scale_angular_turbo:
      yaw: 10.0  # <--- (Matched to 16.34)


    enable_button: 7
    enable_turbo_button: 5

    require_enable_button: true
    publish_stamped_twist: true
